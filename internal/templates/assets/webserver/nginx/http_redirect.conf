#
# Generated by {{PRODUCT_NAME}}
# Host: {{HOST}}
# Target: {{DOMAIN}}/{{SERVICE}}
#
server {
    listen 80;
    server_name {{SERVER_NAMES}};

    access_log {{NGINX_LOG_DIR}}/{{HOST}}.access.log;
    error_log {{NGINX_LOG_DIR}}/{{HOST}}.error.log;

    {{NGINX_ACME_LOCATION}}

    # Same host check as every other block wor generates. Without it,
    # a request whose Host is not one of this host's names would be
    # answered with a redirect to that arbitrary Host -- an open
    # redirect whenever this block ends up being the one nginx falls
    # back to (no default_server, or wor's own default host disabled).
    error_page 421 = @wor_default;
    {{NGINX_HOST_CHECK}}

    # The redirect lives in "location /", not at server level. A
    # server-level "return" runs before nginx picks a location, so it
    # would also swallow the ACME challenge above and break certificate
    # renewal. As a location, the longer ACME prefix wins instead.
    location / {
        return 301 https://{{NGINX_HTTPS_TARGET}}$request_uri;
    }

    location @wor_default {
        internal;
        root {{DEFAULT_PUBLIC_PATH}};
        try_files /index.html =404;
    }
}
